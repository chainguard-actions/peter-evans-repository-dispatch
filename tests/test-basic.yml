name: Test basic usage - repository dispatch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          event-type: test-event
          client-payload: '{"ref": "main", "sha": "abc123"}'

      - name: Assert action was invoked with event-type input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action will fail in act due to no real GitHub API access,
          # but we verify it was invoked (outcome is either success or failure, not skipped)
          outcome="${{ steps.action.outcome }}"
          if [ "$outcome" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with event-type=test-event"
